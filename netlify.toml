[build]
  command = "npm run build"
  publish = "dist"

# Catalogo SPA — 301 on bare /catalogo so trailing slash is added and relative paths resolve
[[redirects]]
  from = "/catalogo"
  to   = "/catalogo/"
  status = 301

[[redirects]]
  from = "/catalogo/*"
  to   = "/catalogo/index.html"
  status = 200
